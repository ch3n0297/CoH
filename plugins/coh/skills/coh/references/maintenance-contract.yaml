contract_version: 4

applies_when:
  - "bootstrap_harness"
  - "maintain_skill"
  - "review_skill"
  - "package_skill"
  - "evaluate_skill"
  - "maintain_plugin_runtime"

activation:
  explicit_only: true
  host_syntax:
    codex:
      - "$coh"
      - "$coh:coh"
    claude-code:
      - "/coh:coh"
  explicit_user_intent:
    - "CoH"
    - "Harness Engineering"
    - "harness bootstrap"
    - "harness design"
    - "Fact Map"
  excluded_tasks:
    - "simple single-file edits"
    - "routine documentation cleanup"
    - "direct repository questions"
    - "one-off scripts"
    - "straightforward bug fixes"

required_sections:
  - "Activation Boundary"
  - "First-Call Bootstrap Boundary"
  - "Lifecycle Hook Boundary"
  - "When Not To Use"
  - "Maintenance Self-Check"
  - "Bootstrap Workflow"
  - "Need Gate"
  - "Harness Model"
  - "Output Contracts"
  - "Control Selection and Proof Boundaries"
  - "Real-World Learning Loop"
  - "References"
  - "Recommendation Rules"

need_gate:
  decisions:
    - "NEEDS_HARNESS"
    - "NO_HARNESS"
    - "INSUFFICIENT_EVIDENCE"
  first_explicit_invocation:
    needs_harness: "attempt complete Bootstrap in the same task"
    no_harness: "do not create Harness files"
    insufficient_evidence: "do not create a speculative model"

fact_statuses:
  - "OBSERVED"
  - "INFERRED"
  - "UNKNOWN"
  - "CONFLICTING"

proof_layers:
  - "static"
  - "runtime"
  - "browser"
  - "live-provider"
  - "production"
  - "human-review"

control_levels:
  - "guidance"
  - "hard gate"
  - "ratchet"
  - "report-only"

authorization:
  explicit_bootstrap:
    repository_local_mutation: true
    allowed_without_second_confirmation:
      - "create canonical model and recoverable Bootstrap journal"
      - "create a new currently-unowned Guide or Sensor"
      - "update a clearly machine-owned extension block"
      - "add a removable pointer block without rewriting surrounding human content"
      - "run a confirmed repository-local side-effect-free validation command"
    must_stop_before:
      - "rewrite human-owned authority, meaning, or precedence"
      - "change protected tests or expected behavior"
      - "change coverage or required-check policy"
      - "change CI or deploy semantics"
      - "replace or wrap an existing validation owner"
      - "write external systems or migrate external data"
      - "use paid resources"
      - "request or change credentials or permissions"
  lifecycle_hooks:
    repository_mutation: false
    local_plugin_data: true
  output_must_state_files_modified: true

plugin_components:
  callable_skills:
    - "coh"
  callable_skill_count: 1
  lifecycle_hooks:
    - "UserPromptSubmit"
    - "Stop"
  hook_manifest_discovery: "hooks/hooks.json"
  hooks_are_skill_activation: false

harness_model:
  canonical_path: ".coh/model.json"
  schema_version: 1
  routing_projection_version: 2
  maximum_bytes: 65536
  mandatory_physical_artifacts:
    - ".coh/model.json"
  logical_roles:
    - "construction"
    - "authorities"
    - "routes"
    - "sensors"
    - "maintenance"
  construction_statuses:
    - "READY"
    - "BLOCKED"
  ready_requires:
    - "at least one route whether enabled or disabled"
    - "all declared live references resolve"
    - "all route and Sensor cross-references resolve"
    - "maintenance owner authorities and triggers are explicit"
    - "no construction blocker remains"
  blocked_requires:
    - "at least one fixed blocker code"
    - "authority or path references whenever the blocker exempts an unresolved declaration"
    - "only authority ids or paths named by a blocker may be unresolved"
  authority_anchor_policy:
    agent-instructions: "forbidden in v1"
    guide: "forbidden in v1"
    fact: "required when READY or not explicitly blocked"
    validation-declaration: "required when READY or not explicitly blocked"
  declares_evidence: false
  physical_guide_layout_fixed: false
  runtime_projection: "derived in memory only"

legacy_route_migration:
  input: ".coh/routes.json"
  direction: "one-way to model.json"
  runtime_authority: false
  dual_read: false
  dual_write: false
  migration_may_invent_maintenance_owner: false
  mechanical_result: "BLOCKED with MAINTENANCE_POLICY_UNCONFIRMED"
  recovery: "matching model plus legacy input may finish removal; divergent files fail closed"

namespace_migration:
  predecessor_namespace: ".hjc-code-harness"
  canonical_namespace: ".coh"
  lifecycle_hook_mutation: false
  predecessor_only_behavior: "LEGACY_NAMESPACE_REQUIRES_MIGRATION"
  dual_namespace_behavior: "COH_NAMESPACE_CONFLICT"
  command: "scripts/migrate_to_coh.py"
  default_mode: "dry-run"
  direction: "one-way without automatic rollback"
  journal_location: "inside the namespace so it survives the atomic rename"
  path_rewrite_scope: "schema-known Model and route repository-path fields only"
  preserves_model_construction_status: true
  route_result: "BLOCKED with MAINTENANCE_POLICY_UNCONFIRMED"
  predecessor_receipts_trusted: false
  worktree_digest_domain: "COH_WORKTREE_V2"

routing:
  repository_opt_in_required: true
  active_when:
    - "model enabled is true"
    - "construction status is READY"
  exact_match_inputs:
    - "explicit [route:<id>] tag"
    - "declared repository-relative path prefix"
  forbidden_match_inputs:
    - "semantic keywords"
    - "whole-repository scan"
    - "model-guessed subsystem"
  ambiguous_behavior: "fixed degraded context and bounded discovery"
  absent_or_disabled_behavior: "silent no-op"
  blocked_behavior: "fixed MODEL_NOT_READY context with blocker codes"
  migration_route_only_behavior: "LEGACY_ROUTES_REQUIRES_MIGRATION"
  predecessor_namespace_behavior: "LEGACY_NAMESPACE_REQUIRES_MIGRATION"
  dual_namespace_behavior: "COH_NAMESPACE_CONFLICT"
  authority: "referenced live repository files"
  receipt_route_effect_binding:
    checkout_rule: "HEAD must equal the commit recorded when the route nonce was issued"
    basis: "all HEAD-different and untracked non-ignored paths, with rename old and new paths represented"
    excluded_path: "only the selected Sensor receipt path"
    rule: "every path must be covered by the selected route path prefixes"
    explicit_tag_bypass: false
    mismatch_status: "NO_TRUSTED_RESULT"
    mismatch_reason: "ROUTE_SCOPE_MISMATCH"
  receipt_path_safety:
    namespace: ".coh/receipts/"
    unique_per_sensor: true
    tracked_allowed: false
    symlink_allowed: false
    hardlink_allowed: false
    authority_or_protected_path_overlap_allowed: false
    nonce_precondition_recorded: true
    rechecked_before_exclusion_and_acceptance: true

sensor_evidence:
  receipt_schema_version: 1
  producer: "repository-owned validation runner"
  accepted_status: "TRUSTED_RECEIPT"
  missing_or_invalid_status: "NO_TRUSTED_RESULT"
  construction_status_independent: true
  assistant_prose_is_evidence: false
  plugin_runs_repository_validation: false
  digest_binding: "versioned canonical in-memory routing projection"
  digest_includes:
    - "routing projection version"
    - "runtime eligibility"
    - "route selectors and evidence policy"
    - "projected authority and Sensor fields"
  digest_excludes:
    - "blocker descriptions"
    - "maintenance metadata"
    - "unused authority declarations"
  proof_limit: "only the declared proof layer"
  protected_authority:
    comparison_base: "current HEAD"
    changed_status: "NO_TRUSTED_RESULT"
    changed_reason: "PROTECTED_AUTHORITY_CHANGED"
    automatic_revert: false

bootstrap_transaction:
  recover_before_new_transaction: true
  preflight_no_change_creates_transaction: false
  human_owned_content_preserved: true
  canonical_model_count: 1
  second_run_semantic_noop: true
  terminal_states:
    - "READY"
    - "BLOCKED"

self_improvement_loop:
  output_location: "PLUGIN_DATA"
  mode: "report-only"
  raw_dialogue_persisted: false
  composite_score: false
  automatic_repository_edits: false
  promotion_requires:
    - "explicit user request"
    - "live evidence review"
    - "repository-owned authority selection"
  review_eligibility:
    minimum_episodes: 3
    minimum_distinct_task_references: 2
    authorizes_update: false

reference_roles:
  source-registry.md: "index, provenance class, and authority limits"
  harness-concepts.md: "background concepts and vocabulary"
  control-selection.md: "control strength decision support"
  proof-boundaries.md: "evidence-layer claim limits"
  repo-derived-patterns.md: "conditional generalized field patterns"
  continuity.md: "conditional long-task and handoff guidance"
  learning-loop.md: "real-world episode review and report-only Guide feedback promotion"

self_check_behavior:
  when_to_run: "only when explicitly bootstrapping, maintaining, reviewing, packaging, or evaluating"
  contract_is_single_authority: true

forbidden_regressions:
  - "implicit-by-default invocation"
  - "slash invocation claimed without forward-test evidence"
  - "shared mandatory repository documentation template"
  - "background reference treated as target-repository authority"
  - "model metadata described as correctness evidence"
  - "static evidence described as runtime, provider, or production proof"
  - "uncalibrated heuristic used as a blocking gate"
  - "private provenance shipped in a distribution package"
  - "duplicate maintenance invariant list outside this contract"
  - "second callable routing or Sensor Skill"
  - "keyword-based automatic routing"
  - "repository-wide discovery before a valid route is tried"
  - "generic plugin-owned validation runner"
  - "assistant prose accepted as test evidence"
  - "stale or cross-turn receipt accepted as current evidence"
  - "raw prompt, assistant message, or tool output persisted by hooks"
  - "composite score hiding routing, correctness, validation, or interaction dimensions"
  - "automatic rewrite of human-owned Guide, Fact Map, AGENTS.md, test, validation, CI, or deployment policy"
  - "model.json and routes.json used as simultaneous live authorities"
  - "migration inventing maintenance ownership or READY confidence"
  - "lifecycle hook automatically moving a predecessor repository namespace"
  - "predecessor receipt accepted after CoH namespace migration"
